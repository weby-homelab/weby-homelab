# Galaxy Profile README Configuration for weby-homelab
username: weby-homelab

# Additional GitHub accounts to aggregate stats from (optional)
# Stats from all accounts will be combined in the dashboard
additional_accounts: []

# Organizations to track contributions to (optional)
# Will fetch languages from org repos where you have contributions
organizations: []

# Profile information displayed in the galaxy header
profile:
  name: "Weby Homelab"
  tagline: "Home Core Architecture | DevSecOps | GPG Security | AI Agent Workspaces"
  company: "Home IT Ecosystem"
  location: "Kyiv, Ukraine"
  bio: |
    Architecting robust home servers (Proxmox Virtual Environment), building secure microservices in Python/Rust,
    and managing an autonomous P.O.W.E.R. Second Brain knowledge base.
    Focusing on high availability, Docker isolation, and GPG-signed workflows.
  philosophy: '"Zero-error execution through plan-act-validate cycles and automated verification."'

# Social links displayed at the bottom of the profile
social:
  email: "rekvizitor.ua@gmail.com"
  linkedin: ""
  website: "https://weby.guru"

# Galaxy arms represent your core focus areas
# Each arm spirals out from the center with its own color and tech items
# Available colors: "synapse_cyan", "dendrite_violet", "axon_amber"
galaxy_arms:
  - name: "Infrastructure & Virtualization"
    color: "synapse_cyan"
    items:
      - "Proxmox VE"
      - "Docker"
      - "LXC"
      - "Tailscale"
      - "AdGuard Home"
  - name: "Software Development"
    color: "dendrite_violet"
    items:
      - "Python"
      - "Rust"
      - "FastAPI"
      - "SQLite"
      - "Bash"
  - name: "Security & Knowledge"
    color: "axon_amber"
    items:
      - "GPG Signing"
      - "Obsidian OKF"
      - "Git Worktrees"
      - "SSH Hardening"

# Featured projects shown as constellation stars
# Each project needs:
#   repo: "owner/repo-name"   — GitHub repository path
#   arm: 0-2                  — Which galaxy arm to associate with (index)
#   description: "..."        — Short description shown on the card
projects:
  - repo: "weby-homelab/power-framework"
    arm: 2
    description: "P.O.W.E.R. - Hybrid Knowledge Management Framework (P.A.R.A. + OKF Overlay + LLM-Wiki + Execution Rules)"
  - repo: "weby-homelab/antigravity-cli-statusline"
    arm: 1
    description: "An advanced, responsive, and high-information statusline plugin for Antigravity CLI"
  - repo: "weby-homelab/Power-Safety-UA"
    arm: 0
    description: "СВІТЛО⚡БЕЗПЕКА / POWER⚡SAFETY — All-in-one real-time monitoring. Power-Safety-UA — autonomous power, air raid, and AQI monitoring system for Kyiv. Docker multi-arch."
  - repo: "weby-homelab/Weby-QRank"
    arm: 1
    description: "🚀 Weby-QRank — Telegram Mini App for community gamification with smart scoring & OLED UI | Сучасний Telegram Mini App для гейміфікації спільноти із розумним скорингом"

# Theme color overrides (optional — defaults to deep space palette)
# All values must be valid hex color codes (#RRGGBB)
theme:
  void: "#080c14" # Darkest background
  nebula: "#0f1623" # Card backgrounds
  star_dust: "#1a2332" # Borders, dividers
  synapse_cyan: "#00d4ff" # Primary accent (arm color 1)
  dendrite_violet: "#a78bfa" # Secondary accent (arm color 2)
  axon_amber: "#ffb020" # Tertiary accent (arm color 3)
  text_bright: "#f1f5f9" # Primary text
  text_dim: "#94a3b8" # Secondary text
  text_faint: "#64748b" # Muted text, labels

# Stats configuration — which metrics to show on the telemetry card
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "issues"
    - "repos"

# Language display settings
languages:
  exclude:
    # Languages to hide from the telemetry chart
    - "HTML"
    - "CSS"
    - "Shell"
    - "Makefile"
  max_display: 8 # Maximum number of languages to show

  # Manual languages to add
  manual:
    Python: 35000
    Rust: 15000
    Bash: 10000
    YAML: 8000
    Markdown: 5000
