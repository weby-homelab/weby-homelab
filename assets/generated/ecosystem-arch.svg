<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="850" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="infra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="knowledge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="flagship" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" fill="#00D4FF" font-family="monospace" font-size="16" font-weight="bold" filter="url(#glow)">Weby Homelab Ecosystem</text>
  <text x="425" y="56" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="11">AI Infrastructure • Homelab • Privacy • Knowledge Systems</text>

  <!-- Global connector (vertical spine) -->
  <line x1="425" y1="60" x2="425" y2="74" stroke="#30363D" stroke-width="2"/>
  <circle cx="425" cy="77" r="4" fill="#00D4FF" opacity="0.6"/>

  <!-- ============ TOP ROW: 3 Pillars ============ -->

  <!-- Pillar 1 — Infrastructure -->
  <rect x="40" y="86" width="230" height="100" rx="8" fill="url(#infra)" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="155" y="112" text-anchor="middle" fill="#00D4FF" font-family="monospace" font-size="13" font-weight="bold">🏗 Infrastructure</text>
  <text x="155" y="130" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">Proxmox VE Cluster</text>
  <text x="155" y="146" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">Tailscale Zero Trust Mesh</text>
  <text x="155" y="162" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">Docker • LXC • Ansible</text>
  <text x="155" y="178" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">NFTables • ADBlock-PD DNS</text>

  <!-- Pillar 2 — AI -->
  <rect x="310" y="86" width="230" height="100" rx="8" fill="url(#ai)" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="425" y="112" text-anchor="middle" fill="#FF6B35" font-family="monospace" font-size="13" font-weight="bold">🤖 AI &amp; LLMs</text>
  <text x="425" y="130" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">Gemini • Gemma • Qwen</text>
  <text x="425" y="146" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">Ollama • llama.cpp • GGUF</text>
  <text x="425" y="162" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">MCP Protocol • RAG (ChromaDB)</text>
  <text x="425" y="178" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">AI Agents • TTS/STT (Kokoro, Whisper)</text>

  <!-- Pillar 3 — Knowledge -->
  <rect x="580" y="86" width="230" height="100" rx="8" fill="url(#knowledge)" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="695" y="112" text-anchor="middle" fill="#FFD700" font-family="monospace" font-size="13" font-weight="bold">🧠 Knowledge</text>
  <text x="695" y="130" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">Obsidian Second Brain</text>
  <text x="695" y="146" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">P.O.W.E.R. Framework</text>
  <text x="695" y="162" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">P.A.R.A. + OKF + LLM-Wiki</text>
  <text x="695" y="178" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">Documentation as Code</text>

  <!-- Connectors: pillars → flagship -->
  <line x1="155" y1="186" x2="155" y2="220" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="425" y1="186" x2="425" y2="220" stroke="#FF6B35" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="695" y1="186" x2="695" y2="220" stroke="#FFD700" stroke-width="1" stroke-opacity="0.3"/>

  <!-- ============ FLAGSHIP PROJECTS ROW ============ -->

  <rect x="40" y="220" width="770" height="130" rx="10" fill="url(#flagship)" stroke="#FFD700" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Flagship title -->
  <text x="425" y="248" text-anchor="middle" fill="#FFD700" font-family="monospace" font-size="12" font-weight="bold">⬡ Flagship Projects</text>

  <!-- Project 1 — Weby-Homelab -->
  <rect x="60" y="260" width="170" height="38" rx="6" fill="#00D4FF" fill-opacity="0.08" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.3"/>
  <text x="145" y="278" text-anchor="middle" fill="#00D4FF" font-family="monospace" font-size="10" font-weight="bold">Weby-Homelab</text>
  <text x="145" y="292" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="8">Central Infrastructure as Code</text>

  <!-- Project 2 — P.O.W.E.R. -->
  <rect x="250" y="260" width="170" height="38" rx="6" fill="#FF6B35" fill-opacity="0.08" stroke="#FF6B35" stroke-width="1" stroke-opacity="0.3"/>
  <text x="335" y="278" text-anchor="middle" fill="#FF6B35" font-family="monospace" font-size="10" font-weight="bold">P.O.W.E.R.</text>
  <text x="335" y="292" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="8">AI Knowledge Management Framework</text>

  <!-- Project 3 — Power-Safety-UA -->
  <rect x="440" y="260" width="170" height="38" rx="6" fill="#FFD700" fill-opacity="0.08" stroke="#FFD700" stroke-width="1" stroke-opacity="0.3"/>
  <text x="525" y="278" text-anchor="middle" fill="#FFD700" font-family="monospace" font-size="10" font-weight="bold">Power-Safety-UA</text>
  <text x="525" y="292" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="8">Public Energy &amp; Safety Monitoring</text>

  <!-- Project 4 — Weby-QRank -->
  <rect x="630" y="260" width="160" height="38" rx="6" fill="#FF6B35" fill-opacity="0.08" stroke="#FF6B35" stroke-width="1" stroke-opacity="0.3"/>
  <text x="710" y="278" text-anchor="middle" fill="#FF6B35" font-family="monospace" font-size="10" font-weight="bold">Weby-QRank</text>
  <text x="710" y="292" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="8">AI Community Gamification</text>

  <!-- ============ MIDDLE: Cross-cutting ============ -->
  <line x1="425" y1="350" x2="425" y2="368" stroke="#30363D" stroke-width="2"/>
  <circle cx="425" cy="371" r="4" fill="#FFD700" opacity="0.6"/>

  <!-- Cross-cutting connector lines from flagship to bottom -->
  <line x1="145" y1="298" x2="145" y2="378" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="335" y1="298" x2="335" y2="378" stroke="#FF6B35" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="525" y1="298" x2="525" y2="378" stroke="#FFD700" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="710" y1="298" x2="710" y2="378" stroke="#FF6B35" stroke-width="1" stroke-opacity="0.15"/>

  <!-- ============ BOTTOM: Design Principles ============ -->

  <rect x="40" y="378" width="770" height="130" rx="10" fill="none" stroke="#30363D" stroke-width="1.5" stroke-dasharray="4,4"/>

  <text x="425" y="404" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="12" font-weight="bold">Design Principles</text>

  <!-- 6 principles in 2 rows -->
  <text x="130" y="428" text-anchor="middle" fill="#00D4FF" font-family="monospace" font-size="11">Local-First</text>
  <text x="320" y="428" text-anchor="middle" fill="#00D4FF" font-family="monospace" font-size="11">Privacy-First</text>
  <text x="510" y="428" text-anchor="middle" fill="#00D4FF" font-family="monospace" font-size="11">Offline-Capable</text>
  <text x="700" y="428" text-anchor="middle" fill="#00D4FF" font-family="monospace" font-size="11">AI-Native</text>

  <text x="130" y="456" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">Build &amp; run on your own hardware</text>
  <text x="320" y="456" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">Zero telemetry, zero tracking</text>
  <text x="510" y="456" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">Works under blackouts &amp; no internet</text>
  <text x="700" y="456" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">MCP-native, agent-first architecture</text>

  <text x="250" y="490" text-anchor="middle" fill="#FFD700" font-family="monospace" font-size="11">Open Standards</text>
  <text x="575" y="490" text-anchor="middle" fill="#FFD700" font-family="monospace" font-size="11">Automation by Default</text>

  <text x="250" y="508" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">MIT-licensed, community-driven</text>
  <text x="575" y="508" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="10">CI/CD, IaC, repeatable deployments</text>
</svg>
